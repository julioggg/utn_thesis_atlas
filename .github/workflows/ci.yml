name: Repository hygiene and synthetic tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit-only test dependencies
        run: python -m pip install 'pandas>=2,<3' 'pyarrow>=16,<24'
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Run synthetic-data unit tests
        run: python -m unittest discover -s tests -v
